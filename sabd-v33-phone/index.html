<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SABD V33 Preview</title></head><body><div id="status" style="font:16px system-ui;padding:32px">Loading SABD preview…</div><script>(async()=>{try{const params=new URLSearchParams(location.search);const share=params.get('_vercel_share');const suffix=share?'?_vercel_share='+encodeURIComponent(share):'';const names=['chunk01.txt','chunk02.txt'];const parts=[];for(const name of names){const r=await fetch(name+suffix,{credentials:'include',cache:'no-store'});if(!r.ok)throw new Error(name+' '+r.status);parts.push((await r.text()).trim());}const base64=parts.join('').replace(/\s+/g,'');const raw=atob(base64);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);let html;if('DecompressionStream'in window){const ds=new DecompressionStream('gzip');html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();}else{throw new Error('Browser decompression unavailable');}document.open();document.write(html);document.close();}catch(e){console.error(e);document.getElementById('status').innerHTML='<strong>Preview could not load.</strong><br>Please reopen the latest link from ChatGPT.';}})();</script></body></html>
