<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SABD V33 Preview</title></head><body><div id="status" style="font:16px system-ui;padding:32px">Loading SABD preview…</div><script>(async()=>{try{const urls=['https://raw.githubusercontent.com/SeamusArgyle/vercel-test/sabd-v33-phone-preview/sabd-v33-phone/chunk01.txt','https://raw.githubusercontent.com/SeamusArgyle/vercel-test/sabd-v33-phone-preview/sabd-v33-phone/chunk02.txt'];const parts=[];for(const url of urls){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(url+' '+r.status);parts.push((await r.text()).trim());}const base64=parts.join('').replace(/\s+/g,'');const raw=atob(base64);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('DecompressionStream unavailable');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close();}catch(e){console.error(e);document.getElementById('status').innerHTML='<strong>Preview could not load.</strong><br>'+String(e.message||e);}})();</script></body></html>
